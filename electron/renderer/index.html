<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: https:; font-src 'self' data:"
    />
    <title>Copilot Sessions</title>
    <link rel="stylesheet" href="../node_modules/@highlightjs/cdn-assets/styles/github-dark.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="side-actions">
        <button id="btn-new" class="primary" title="Start a new session in a folder">+ New session</button>
        <button id="btn-refresh" title="Reload the session list">↻</button>
        <button id="btn-settings" title="Settings">⚙</button>
      </div>
      <input id="search" type="search" placeholder="Filter by title or folder…" />
      <div id="session-list"></div>
      <div id="side-quota" hidden></div>
      <div id="side-status"></div>
    </aside>

    <main id="main">
      <div id="empty" class="empty">
        <h1>Copilot Sessions</h1>
        <p>Pick a session on the left to resume it, or start a new one in any folder.</p>
        <button id="btn-new-2" class="primary">+ New session</button>
      </div>
      <!-- one .session-view per open session is inserted here -->
    </main>

    <dialog id="settings">
      <form method="dialog">
        <h2>Settings</h2>
        <label>
          Copilot CLI command
          <input id="set-command" placeholder="copilot" spellcheck="false" />
        </label>
        <p class="hint" id="set-hint"></p>
        <label class="check">
          <span><input id="set-relay" type="checkbox" /> Connect sessions to copilot-relay</span>
        </label>
        <p class="hint" id="set-relay-hint"></p>
        <h3>Files</h3>
        <div class="store">
          <div class="store-label">Pasted images</div>
          <code id="store-pastes" class="path"></code>
          <p class="hint" id="store-pastes-info"></p>
          <div class="store-actions">
            <button id="store-open" type="button">Open folder</button>
            <button id="store-clear" type="button" class="danger">Delete pasted images</button>
          </div>
          <div class="store-label">Settings file</div>
          <code id="store-settings" class="path"></code>
        </div>
        <div class="dialog-actions">
          <button value="cancel">Cancel</button>
          <button id="set-save" value="save" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <div id="viewer" hidden tabindex="-1" role="dialog" aria-label="Image viewer">
      <div class="viewer-stage"><img alt="" draggable="false" /></div>
      <div class="viewer-bar">
        <button data-act="prev" title="Previous image (←)">‹</button>
        <button data-act="next" title="Next image (→)">›</button>
        <button data-act="out" title="Zoom out (-)">−</button>
        <button data-act="fit" class="viewer-zoom" title="Fit to window (0)">100 %</button>
        <button data-act="in" title="Zoom in (+)">+</button>
        <button data-act="full" title="Full screen (F)">⛶</button>
        <button data-act="close" title="Close (Esc)">✕</button>
      </div>
      <div class="viewer-cap"></div>
    </div>

    <div id="file-preview" hidden tabindex="-1" role="dialog" aria-label="File preview">
      <aside class="fp-list">
        <div class="fp-list-title">Files</div>
        <div class="fp-items"></div>
      </aside>
      <section class="fp-main">
        <header class="fp-head">
          <div class="fp-title">
            <div class="fp-name"></div>
            <div class="fp-path"></div>
          </div>
          <div class="fp-actions">
            <button data-act="md" hidden></button>
            <button data-act="system" title="Open with the default application">Open in system app</button>
            <button data-act="close" title="Close (Esc)">✕</button>
          </div>
        </header>
        <div class="fp-content"></div>
      </section>
      <div class="fp-confirm" hidden>
        <div class="fp-confirm-box">
          <p>This file is outside the session folder. Open it?</p>
          <code class="fp-confirm-path"></code>
          <div class="fp-confirm-actions">
            <button data-act="deny">Cancel</button>
            <button data-act="allow" class="primary">Open</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="commands.js"></script>
    <script src="file-links.js"></script>
    <script src="ui-state.js"></script>
    <script src="../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
    <script src="file-preview.js"></script>
    <script src="app.js"></script>
  </body>
</html>
