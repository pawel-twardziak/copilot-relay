<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#6e40c9"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="b"/>
      <feFlood flood-color="#0d1117" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- back bubble (another session) -->
  <g opacity="0.55">
    <rect x="190" y="210" width="460" height="330" rx="90" fill="#ffffff"/>
    <path d="M300 520 L250 630 L390 530 Z" fill="#ffffff"/>
  </g>

  <!-- front bubble with a terminal prompt -->
  <g filter="url(#shadow)">
    <rect x="360" y="400" width="480" height="350" rx="95" fill="url(#front)"/>
    <path d="M730 730 L790 850 L640 745 Z" fill="#e3e9f5"/>
  </g>
  <path d="M465 505 L560 575 L465 645" fill="none" stroke="#3b4bd8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="595" y="620" width="140" height="44" rx="22" fill="#3b4bd8"/>
</svg>
