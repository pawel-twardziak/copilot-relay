# TEMPORARY (branch fix/broker-shutdown-flush only): runs the whole broker-shutdown test file many times on Windows,
# under load (6 at a time, as in the full suite where the test files run in parallel), with main's server.mjs
# (baseline) and with the fixed one, and counts how often "POST /api/shutdown answers…" fails. Removed before the
# branch is merged.
name: Shutdown stress

on:
  push:
    branches: [fix/broker-shutdown-flush]

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fix]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci --prefix electron --omit=dev
      - name: main's server.mjs
        if: matrix.variant == 'baseline'
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- server.mjs
      - name: broker-shutdown.test.mjs, 6 workers x 40 runs (${{ matrix.variant }})
        shell: bash
        run: |
          set +e
          worker() {
            local fail=0
            for i in $(seq 1 40); do
              node --test electron/test/broker-shutdown.test.mjs > "out-$1.txt" 2>&1
              if grep -q "^not ok [0-9]* - POST /api/shutdown answers" "out-$1.txt"; then
                fail=$((fail+1))
                grep -A12 "^not ok [0-9]* - POST /api/shutdown answers" "out-$1.txt" | grep -E "error:" >> "errors-$1.txt"
              fi
            done
            echo "$fail" > "fail-$1.txt"
          }
          for w in $(seq 1 6); do worker "$w" & done
          wait
          total=0
          for w in $(seq 1 6); do total=$((total + $(cat "fail-$w.txt"))); done
          cat errors-*.txt 2>/dev/null | sort | uniq -c | head -10
          echo "variant=${{ matrix.variant }} runs=240 failed=$total"
          if [ "${{ matrix.variant }}" = "fix" ] && [ "$total" -ne 0 ]; then exit 1; fi
          exit 0
