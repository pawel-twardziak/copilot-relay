name: Desktop app

# Builds the Electron app (electron/) for Windows and Linux.
# - push a tag like v0.2.0 → builds and attaches the files to a GitHub Release
# - "Run workflow" in the Actions tab → builds and uploads the files as workflow artifacts only
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          - os: ubuntu-latest
            target: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run dist -- ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: copilot-sessions-${{ runner.os }}
          if-no-files-found: error
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
