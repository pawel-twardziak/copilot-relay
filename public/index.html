<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>copilot-relay</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#d8dce4; --dim:#7d8596; --acc:#6aa9ff; --warn:#e6b450; --ok:#7fd18b; --err:#f07178; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header b { color:var(--acc); }
  #budget { color:var(--dim); margin-left:auto; }
  #newSess { display:flex; gap:4px; }
  #newSess input { background:#11141a; color:var(--fg); border:1px solid var(--line); padding:3px 6px; font:inherit; }
  #err { color:var(--err); }
  #empty { color:var(--dim); padding:24px; background:var(--panel); }
  .cwd { color:var(--dim); font-size:11px; padding:2px 10px; border-bottom:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { flex:1; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(320px,1fr); gap:1px; background:var(--line); min-height:0; }
  .col { background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .col h2 { margin:0; padding:8px 10px; font-size:13px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .state { font-weight:normal; font-size:11px; padding:1px 6px; border-radius:8px; background:#222836; color:var(--dim); }
  .state.working { color:var(--warn); } .state.idle { color:var(--ok); } .state.exited { color:var(--err); }
  .q { font-weight:normal; color:var(--dim); font-size:11px; }
  .log { flex:1; overflow:auto; padding:8px 10px; }
  .m { margin:0 0 8px; white-space:pre-wrap; word-break:break-word; }
  .m.in { border-left:2px solid var(--acc); padding-left:6px; color:#b9c9e6; }
  .m.out { border-left:2px solid var(--ok); padding-left:6px; color:#c4e6c9; }
  .m .who { color:var(--dim); font-size:11px; display:block; }
  .m.thought { color:var(--dim); font-style:italic; }
  .tool { color:var(--dim); font-size:11px; margin:0 0 6px; }
  .tool.completed::before { content:"✓ "; color:var(--ok); } .tool.failed::before { content:"✗ "; color:var(--err); }
  .tool.pending::before, .tool.in_progress::before { content:"… "; }
  .perm { border:1px solid var(--warn); padding:6px; margin:0 0 8px; border-radius:4px; }
  .perm button { margin:4px 4px 0 0; }
  .sys { color:var(--err); font-size:11px; margin:0 0 6px; }
  form { display:flex; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:56px; background:#11141a; color:var(--fg); border:0; padding:8px; font:inherit; }
  button { background:#222836; color:var(--fg); border:1px solid var(--line); cursor:pointer; font:inherit; padding:4px 10px; }
  button:hover { border-color:var(--acc); }
  #bcast { padding:6px 12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  #bcast input { flex:1; background:#11141a; color:var(--fg); border:1px solid var(--line); padding:6px; font:inherit; }
</style>
</head>
<body>
<header>
  <b>copilot-relay</b><span id="conn">łączenie…</span>
  <form id="newSess">
    <input name="name" placeholder="nazwa*" required pattern="[a-z0-9][a-z0-9_-]{0,31}" size="10">
    <input name="role" placeholder="rola (opcjonalnie)" size="28">
    <input name="cwd" placeholder="katalog (domyślny)" size="22">
    <input name="model" placeholder="model (domyślny)" size="14">
    <button>+ sesja</button>
  </form>
  <span id="err"></span><span id="budget"></span>
</header>
<main id="cols"></main>
<form id="bcast"><input placeholder="Wiadomość do wszystkich sesji…"><button>Wyślij do *</button></form>
<script>
const cols = document.getElementById("cols");
const ui = {};            // agent -> {log, state, q, cur:{text,thought}}
const tools = {};         // agent:toolId -> element

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll(log) { if (log.scrollHeight - log.scrollTop - log.clientHeight < 120) log.scrollTop = log.scrollHeight; }
async function post(url, body) { await fetch(url, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body) }); }

const KIND = { acp: "GUI", cli: "terminal", mcp: "MCP" };
function infoText(p) { return `${KIND[p.kind] ?? p.kind}${p.role ? " · " + p.role : ""} · ${p.cwd || "?"}${p.model ? " · " + p.model : ""}`; }

function makeCol(p) {
  const { name, kind } = p;
  if (ui[name]) return updateCol(p);
  document.getElementById("empty")?.remove();
  const col = el("section", "col");
  const h = el("h2"); const title = el("span", null, name); h.append(title);
  const state = el("span", "state", kind === "acp" ? "start…" : (p.online ? "online" : "offline")); const q = el("span", "q");
  const stop = el("button", null, "stop"); stop.style.marginLeft = "auto"; stop.title = "session/cancel";
  stop.onclick = () => post("/api/cancel", { agent: col.dataset.name });
  if (kind !== "acp") stop.style.visibility = "hidden";
  const close = el("button", null, "×"); close.title = kind === "acp" ? "zamknij sesję" : "usuń z relay (sesja w terminalu działa dalej)";
  close.onclick = () => { const n = col.dataset.name; if (confirm(kind === "acp" ? `Zamknąć sesję ${n}?` : `Usunąć ${n} z relay?`)) fetch(`/api/sessions?name=${encodeURIComponent(n)}`, { method:"DELETE" }); };
  h.append(state, q, stop, close); h.title = p.role || "";
  const info = el("div", "cwd", infoText(p)); info.title = info.textContent;
  const log = el("div", "log");
  const form = el("form"); const ta = el("textarea"); ta.placeholder = `Wiadomość do ${name} (Enter wysyła, Shift+Enter = nowa linia)`;
  const btn = el("button", null, "→"); form.append(ta, btn);
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
  form.onsubmit = (e) => { e.preventDefault(); const text = ta.value.trim(); if (!text) return; ta.value = ""; post("/api/send", { to: col.dataset.name, text }); };
  col.dataset.name = name;
  col.append(h, info, log, form); cols.append(col);
  ui[name] = { col, log, state, q, title, info, kind, cur: null };
  if (kind !== "acp") log.append(el("div", "tool", kind === "cli" ? "Sesja w terminalu: widać tu tylko wiadomości relay." : "Klient MCP: wiadomości trafiają do jego skrzynki."));
}

function updateCol(p) {
  const u = ui[p.name]; if (!u) return makeCol(p);
  u.info.textContent = u.info.title = infoText(p);
  if (u.kind !== "acp") { u.state.textContent = p.online ? "online" : "offline"; u.state.className = "state " + (p.online ? "idle" : "exited"); }
}

function renameCol(old, p) {
  const u = ui[old]; if (!u) return makeCol(p);
  delete ui[old]; ui[p.name] = u; u.col.dataset.name = p.name; u.title.textContent = p.name; updateCol(p);
}

function emptyCheck() {
  if (!Object.keys(ui).length) cols.innerHTML = '<div id="empty">Brak sesji. Dodaj sesję przyciskiem „+ sesja” albo uruchom <code>copilot</code> w terminalu z zainstalowanym rozszerzeniem.</div>';
}

function chunk(agent, kind, text) {
  const u = ui[agent]; if (!u) return;
  if (!u.cur || u.cur.kind !== kind) {
    const e = el("div", "m " + (kind === "thought" ? "thought" : "out"));
    u.log.append(e); u.cur = { kind, e };
  }
  u.cur.e.textContent += text; scroll(u.log);
}

function handle(ev) {
  const u = ui[ev.agent];
  switch (ev.type) {
    case "chunk": chunk(ev.agent, ev.kind, ev.text); break;
    case "message": {
      const dst = ui[ev.to]; if (!dst) break;
      dst.cur = null;
      const e = el("div", "m in"); e.append(el("span", "who", `← ${ev.from}`), document.createTextNode(ev.text));
      dst.log.append(e); scroll(dst.log);
      if (ev.from !== "user" && ui[ev.from]) {
        const s = el("div", "tool completed", `→ ${ev.to}: ${ev.text.slice(0, 120)}${ev.text.length > 120 ? "…" : ""}`);
        ui[ev.from].log.append(s); ui[ev.from].cur = null;
      }
      if (ev.budget != null) document.getElementById("budget").textContent = `budżet wiadomości agent→agent: ${ev.budget}`;
      break;
    }
    case "tool": {
      if (!u) break;
      const key = ev.agent + ":" + ev.id; let e = tools[key];
      if (!e) { e = el("div", "tool"); tools[key] = e; u.log.append(e); u.cur = null; }
      if (ev.title) e.dataset.title = ev.title;
      e.textContent = e.dataset.title || ev.id; e.className = "tool " + (ev.status || "pending"); scroll(u.log);
      break;
    }
    case "status": if (u) { u.state.textContent = ev.state; u.state.className = "state " + ev.state; } break;
    case "queue": if (u) u.q.textContent = ev.n ? `kolejka: ${ev.n}` : ""; break;
    case "turn_end": if (u) u.cur = null; break;
    case "permission": {
      if (!u) break;
      const box = el("div", "perm"); box.id = "perm-" + ev.reqId;
      box.append(el("div", null, `Uprawnienie: ${ev.toolCall?.title ?? ev.toolCall?.toolCallId ?? "?"}`));
      for (const o of ev.options ?? []) {
        const b = el("button", null, o.name); b.onclick = () => post("/api/permission", { agent: ev.agent, reqId: ev.reqId, optionId: o.optionId });
        box.append(b);
      }
      const c = el("button", null, "Anuluj"); c.onclick = () => post("/api/permission", { agent: ev.agent, reqId: ev.reqId, optionId: null });
      box.append(c); u.log.append(box); u.cur = null; scroll(u.log);
      break;
    }
    case "peer_added": makeCol(ev); break;
    case "peer_updated": updateCol(ev); break;
    case "peer_renamed": renameCol(ev.old, ev); break;
    case "peer_removed": ui[ev.name]?.col.remove(); delete ui[ev.name]; emptyCheck(); break;
    case "permission_done": document.getElementById("perm-" + ev.reqId)?.remove(); break;
    case "system": {
      const targets = ev.agent && ui[ev.agent] ? [ui[ev.agent]] : Object.values(ui);
      for (const x of targets) { x.log.append(el("div", "sys", ev.text)); x.cur = null; }
      break;
    }
  }
}

document.getElementById("bcast").onsubmit = (e) => {
  e.preventDefault(); const i = e.target.querySelector("input"); const text = i.value.trim(); if (!text) return;
  i.value = ""; post("/api/send", { to: "*", text });
};

document.getElementById("newSess").onsubmit = async (e) => {
  e.preventDefault(); const f = e.target; const err = document.getElementById("err"); err.textContent = "uruchamiam…";
  const body = Object.fromEntries([...new FormData(f)].filter(([, v]) => v.trim()));
  const r = await fetch("/api/sessions", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body) });
  if (r.ok) { f.reset(); err.textContent = ""; } else err.textContent = (await r.json().catch(() => ({}))).error ?? r.statusText;
};

const es = new EventSource("/events");
es.onopen = () => document.getElementById("conn").textContent = "połączono";
es.onerror = () => document.getElementById("conn").textContent = "rozłączono — ponawiam…";
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.type === "hello") {
    cols.innerHTML = ""; for (const k in ui) delete ui[k]; for (const k in tools) delete tools[k];
    // replay full history (sessions appear/disappear in order), then make sure live ones exist
    ev.history.forEach(handle); ev.peers.forEach(makeCol); emptyCheck();
  } else handle(ev);
};
</script>
</body>
</html>
