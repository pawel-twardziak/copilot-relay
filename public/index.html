<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>copilot-relay</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#d8dce4; --dim:#7d8596; --acc:#6aa9ff; --warn:#e6b450; --ok:#7fd18b; --err:#f07178; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header b { color:var(--acc); }
  #budget { color:var(--dim); margin-left:auto; }
  #newSess { display:flex; gap:4px; }
  #newSess input { background:#11141a; color:var(--fg); border:1px solid var(--line); padding:3px 6px; font:inherit; }
  #err { color:var(--err); }
  #empty { color:var(--dim); padding:24px; background:var(--panel); }
  .cwd { color:var(--dim); font-size:11px; padding:2px 10px; border-bottom:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { flex:1; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(320px,1fr); gap:1px; background:var(--line); min-height:0; }
  .col { background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .col h2 { margin:0; padding:8px 10px; font-size:13px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .state { font-weight:normal; font-size:11px; padding:1px 6px; border-radius:8px; background:#222836; color:var(--dim); }
  .state.working { color:var(--warn); } .state.idle { color:var(--ok); } .state.exited { color:var(--err); }
  .q { font-weight:normal; color:var(--dim); font-size:11px; }
  .log { flex:1; overflow:auto; padding:8px 10px; }
  .m { margin:0 0 8px; white-space:pre-wrap; word-break:break-word; }
  .m.in { border-left:2px solid var(--acc); padding-left:6px; color:#b9c9e6; }
  .m.out { border-left:2px solid var(--ok); padding-left:6px; color:#c4e6c9; }
  .m .who { color:var(--dim); font-size:11px; display:block; }
  .m.thought { color:var(--dim); font-style:italic; }
  .tool { color:var(--dim); font-size:11px; margin:0 0 6px; }
  .tool.completed::before { content:"✓ "; color:var(--ok); } .tool.failed::before { content:"✗ "; color:var(--err); }
  .tool.pending::before, .tool.in_progress::before { content:"… "; }
  .perm { border:1px solid var(--warn); padding:6px; margin:0 0 8px; border-radius:4px; }
  .perm button { margin:4px 4px 0 0; }
  .sys { color:var(--err); font-size:11px; margin:0 0 6px; }
  .col.gone { opacity:.55; }
  .peer { color:inherit; }
  form { display:flex; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:56px; background:#11141a; color:var(--fg); border:0; padding:8px; font:inherit; }
  button { background:#222836; color:var(--fg); border:1px solid var(--line); cursor:pointer; font:inherit; padding:4px 10px; }
  button:hover { border-color:var(--acc); }
  #bcast { padding:6px 12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  #bcast input { flex:1; background:#11141a; color:var(--fg); border:1px solid var(--line); padding:6px; font:inherit; }
</style>
</head>
<body>
<header>
  <b>copilot-relay</b><span id="conn">connecting…</span>
  <form id="newSess">
    <input name="name" placeholder="name*" required pattern="[a-z0-9][a-z0-9_-]{0,31}" size="10">
    <input name="role" placeholder="role (optional)" size="28">
    <input name="cwd" placeholder="directory (default)" size="22">
    <input name="model" placeholder="model (default)" size="14">
    <button>+ session</button>
  </form>
  <span id="err"></span><span id="budget"></span>
</header>
<main id="cols"></main>
<form id="bcast"><input placeholder="Message to all sessions…"><button>Send to *</button></form>
<script>
// Everything is keyed by the broker's stable peer key; names are only labels and can change.
const cols = document.getElementById("cols");
const ui = {};        // key -> column state
const names = {};     // key -> current display name
const tools = {};     // key:toolId -> element

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll(log) { if (log.scrollHeight - log.scrollTop - log.clientHeight < 120) log.scrollTop = log.scrollHeight; }
async function post(url, body) { return fetch(url, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body) }); }
const keyOfName = (n) => Object.keys(names).find((k) => names[k] === n);

/** A peer label that follows renames: <span data-key> updated in place. */
function who(key, fallback) {
  const span = el("span", "peer", key ? (names[key] ?? fallback) : fallback);
  if (key) span.dataset.key = key;
  return span;
}
function relabel(key) {
  for (const e of document.querySelectorAll(`span.peer[data-key="${CSS.escape(key)}"]`)) e.textContent = names[key];
}

const KIND = { acp: "GUI", cli: "terminal", mcp: "MCP" };
function infoText(p) { return `${KIND[p.kind] ?? p.kind}${p.role ? " · " + p.role : ""} · ${p.cwd || "?"}${p.model ? " · " + p.model : ""}`; }

function emptyCheck() {
  document.getElementById("empty")?.remove();
  if (!Object.keys(ui).length) {
    const d = el("div"); d.id = "empty";
    d.innerHTML = 'No sessions yet. Add one with “+ session” or start <code>copilot</code> in a terminal with the extension installed.';
    cols.append(d);
  }
}

function makeCol(p) {
  const { key, kind } = p;
  names[key] = p.name;
  if (ui[key]) return updateCol(p);
  document.getElementById("empty")?.remove();
  const col = el("section", "col");
  const h = el("h2"); const title = who(key, p.name); h.append(title);
  if (kind !== "mcp") {
    title.style.cursor = "pointer"; title.title = "click to rename";
    title.onclick = async () => {
      const cur = names[key]; const n = prompt(`New name for “${cur}” (a-z, 0-9, -, _):`, cur);
      if (!n || n === cur) return;
      const r = await post("/api/rename", { name: cur, newName: n });
      if (!r.ok) alert((await r.json().catch(() => ({}))).error ?? r.statusText);
    };
  }
  const state = el("span", "state"); const q = el("span", "q");
  const stop = el("button", null, "stop"); stop.style.marginLeft = "auto"; stop.title = "session/cancel";
  stop.onclick = () => post("/api/cancel", { agent: names[key] });
  if (kind !== "acp") stop.style.visibility = "hidden";
  const close = el("button", null, "×");
  close.title = kind === "acp" ? "close session" : "remove from relay (the terminal session keeps running)";
  close.onclick = () => {
    const u = ui[key];
    if (u?.gone) { removeCol(key); return; } // already gone from the broker → just hide the column
    const n = names[key];
    if (confirm(kind === "acp" ? `Close session ${n}?` : `Remove ${n} from the relay?`)) fetch(`/api/sessions?name=${encodeURIComponent(n)}`, { method:"DELETE" });
  };
  h.append(state, q, stop, close);
  const info = el("div", "cwd");
  const log = el("div", "log");
  const form = el("form"); const ta = el("textarea");
  const btn = el("button", null, "→"); form.append(ta, btn);
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
  form.onsubmit = (e) => { e.preventDefault(); const text = ta.value.trim(); if (!text) return; ta.value = ""; post("/api/send", { to: names[key], text }); };
  col.append(h, info, log, form); cols.append(col);
  ui[key] = { col, log, state, q, info, ta, kind, cur: null, gone: false };
  if (kind !== "acp") log.append(el("div", "tool", kind === "cli" ? "Terminal session: only relay messages are shown here." : "MCP client: messages go to its inbox."));
  updateCol(p);
}

function updateCol(p) {
  const u = ui[p.key]; if (!u) return makeCol(p);
  names[p.key] = p.name; relabel(p.key);
  u.gone = false; u.col.classList.remove("gone");
  u.info.textContent = u.info.title = infoText(p);
  u.ta.placeholder = `Message to ${p.name} (Enter sends, Shift+Enter = new line)`;
  if (u.kind !== "acp") setState(u, p.online ? "online" : "offline", p.online ? "idle" : "exited");
  else if (!u.state.textContent) setState(u, "start…", "");
}

function setState(u, text, cls) { u.state.textContent = text; u.state.className = "state " + cls; }

function removeCol(key) { ui[key]?.col.remove(); delete ui[key]; emptyCheck(); }

function chunk(u, kind, text) {
  if (!u.cur || u.cur.kind !== kind) {
    const e = el("div", "m " + (kind === "thought" ? "thought" : "out"));
    u.log.append(e); u.cur = { kind, e };
  }
  u.cur.e.textContent += text; scroll(u.log);
}

function colFor(ev) { return ui[ev.key] ?? ui[keyOfName(ev.agent)]; }

function handle(ev) {
  switch (ev.type) {
    case "peer_added": makeCol(ev); break;
    case "peer_updated": updateCol(ev); break;
    case "peer_renamed": names[ev.key] = ev.name; updateCol(ev); break;
    case "peer_removed": {
      // closed by the user (×) → drop the column; dropped after a timeout / exit → keep the history, grey it out
      if (ev.reason === "user" || ev.kind === "mcp") { removeCol(ev.key); break; }
      const u = ui[ev.key]; if (!u) break;
      u.gone = true; u.col.classList.add("gone"); setState(u, "ended", "exited");
      break;
    }
    case "message": {
      const dst = ui[ev.toKey] ?? ui[keyOfName(ev.to)];
      if (dst) {
        dst.cur = null;
        const e = el("div", "m in"); const w = el("span", "who", "← "); w.append(who(ev.fromKey, ev.from));
        e.append(w, document.createTextNode(ev.text)); dst.log.append(e); scroll(dst.log);
      }
      const src = ev.fromKey ? ui[ev.fromKey] : null;
      if (src) {
        const s = el("div", "tool completed", "→ "); s.append(who(ev.toKey, ev.to), document.createTextNode(`: ${ev.text.slice(0, 120)}${ev.text.length > 120 ? "…" : ""}`));
        src.log.append(s); src.cur = null; scroll(src.log);
      }
      if (ev.budget != null) document.getElementById("budget").textContent = `agent→agent message budget: ${ev.budget}`;
      break;
    }
    case "chunk": { const u = colFor(ev); if (u) chunk(u, ev.kind, ev.text); break; }
    case "tool": {
      const u = colFor(ev); if (!u) break;
      const k = (ev.key ?? ev.agent) + ":" + ev.id; let e = tools[k];
      if (!e) { e = el("div", "tool"); tools[k] = e; u.log.append(e); u.cur = null; }
      if (ev.title) e.dataset.title = ev.title;
      e.textContent = e.dataset.title || ev.id; e.className = "tool " + (ev.status || "pending"); scroll(u.log);
      break;
    }
    case "status": { const u = colFor(ev); if (u) setState(u, ev.state, ev.state); break; }
    case "queue": { const u = colFor(ev); if (u) u.q.textContent = ev.n ? `queued: ${ev.n}` : ""; break; }
    case "turn_end": { const u = colFor(ev); if (u) u.cur = null; break; }
    case "permission": {
      const u = colFor(ev); if (!u) break;
      const box = el("div", "perm"); box.id = "perm-" + ev.reqId;
      box.append(el("div", null, `Permission: ${ev.toolCall?.title ?? ev.toolCall?.toolCallId ?? "?"}`));
      for (const o of ev.options ?? []) {
        const b = el("button", null, o.name); b.onclick = () => post("/api/permission", { agent: names[ev.key] ?? ev.agent, reqId: ev.reqId, optionId: o.optionId });
        box.append(b);
      }
      const c = el("button", null, "Cancel"); c.onclick = () => post("/api/permission", { agent: names[ev.key] ?? ev.agent, reqId: ev.reqId, optionId: null });
      box.append(c); u.log.append(box); u.cur = null; scroll(u.log);
      break;
    }
    case "permission_done": document.getElementById("perm-" + ev.reqId)?.remove(); break;
    case "system": {
      const one = colFor(ev);
      for (const x of one ? [one] : Object.values(ui)) { x.log.append(el("div", "sys", ev.text)); x.cur = null; }
      break;
    }
  }
}

document.getElementById("bcast").onsubmit = (e) => {
  e.preventDefault(); const i = e.target.querySelector("input"); const text = i.value.trim(); if (!text) return;
  i.value = ""; post("/api/send", { to: "*", text });
};

document.getElementById("newSess").onsubmit = async (e) => {
  e.preventDefault(); const f = e.target; const err = document.getElementById("err"); err.textContent = "starting…";
  const body = Object.fromEntries([...new FormData(f)].filter(([, v]) => v.trim()));
  const r = await post("/api/sessions", body);
  if (r.ok) { f.reset(); err.textContent = ""; } else err.textContent = (await r.json().catch(() => ({}))).error ?? r.statusText;
};

const es = new EventSource("/events");
es.onopen = () => document.getElementById("conn").textContent = "connected";
es.onerror = () => document.getElementById("conn").textContent = "disconnected — retrying…";
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.type === "hello") {
    cols.innerHTML = ""; for (const o of [ui, names, tools]) for (const k in o) delete o[k];
    ev.history.forEach(handle);
    ev.peers.forEach(makeCol);          // live peers (also fixes labels to current names)
    emptyCheck();
  } else handle(ev);
};
</script>
</body>
</html>
